{% extends "base.html" %}
{% block start %}
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-3">Register</h3>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Display Django messages -->
            {% if messages %}
                <div>
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} mt-2" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
            
            <!-- First Name Field -->
            <div class="mb-3">
                <label for="first" class="form-label">First Name</label>
                <input type="text" class="form-control" id="first" name="first" required>
            </div>
            
            <!-- Last Name Field -->
            <div class="mb-3">
                <label for="last" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="last" name="last" required>
            </div>
            
            <!-- Username Field -->
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            
            <!-- Password Field -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <!-- Register Button -->
            <button type="submit" class="btn btn-primary w-100">Register</button>
            
            <!-- Link to Login -->
            <div class="mt-3 text-center">
                <p class="mb-0">I have an account <a href="/login/" class="text-decoration-none">Sign in here</a></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}
